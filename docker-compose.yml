name: dineq-lab5
x-app: &app
  image: dineq-lab5:local
  build: .
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dineq
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}
      POSTGRES_DB: dineq_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U dineq -d dineq_dev']
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    <<: *app
    environment:
      DATABASE_URL: postgresql://dineq:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}@db:5432/dineq_dev
    depends_on:
      db:
        condition: service_healthy
    command: [node, database/migrate.js]
    restart: 'no'
  seed:
    <<: *app
    profiles: [tools]
    environment:
      DATABASE_URL: postgresql://dineq:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}@db:5432/dineq_dev
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:?Set SEED_DEMO_PASSWORD locally}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: [node, database/seed/seed.js]
    restart: 'no'
  app:
    <<: *app
    environment:
      DATABASE_URL: postgresql://dineq:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD locally}@db:5432/dineq_dev
      PORT: 3000
      NODE_ENV: production
      APP_ORIGIN: ${COMPOSE_APP_ORIGIN:-http://localhost:8080}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-3600}
      COOKIE_SECURE: 'false'
    ports:
      - '127.0.0.1:${COMPOSE_PORT:-8080}:3000'
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/api/health").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
